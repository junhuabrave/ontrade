[project]
name = "ontrade"
version = "0.0.1"
description = "OnTrade systematic trading platform — Python components"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["strategies*", "research*", "post_trade*", "ref_data*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM"]

# B027 (empty method in abstract base class) is by design in the Strategy SDK:
# on_trade / on_timer / on_fill / on_session_state are no-op defaults that
# strategies override only when they need them. Marking them @abstractmethod
# would force every strategy to stub them, which is the opposite of the
# contract.
[tool.ruff.lint.per-file-ignores]
"strategies/sdk/strategy.py" = ["B027"]

[tool.mypy]
python_version = "3.12"
strict = true
